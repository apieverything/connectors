services:
  instagram-connector:
    build: .
    container_name: api-everything-instagram
    restart: unless-stopped
    ports:
      - "${PORT:-3000}:3000"
    env_file:
      - path: .env
        required: false
    environment:
      HOST: 0.0.0.0
    # If you use IG_PROXIES_FILE, mount the file instead of baking it into
    # the image (credentials must never end up in a Docker layer):
    # volumes:
    #   - ./proxies.txt:/app/proxies.txt:ro
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
